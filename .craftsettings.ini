#
# CraftMaster settings for the GitHub Actions backup build (see .github/workflows/windows-craft.yml).

[General]
Command = craft
Branch = master
ShallowClone = True

[GeneralSettings]
Version/ConfigVersion = 6

ShortPath/Enabled = False
# RelWithDebInfo matches KDE's public binary cache (files.kde.org/craft/Qt6/.../RelWithDebInfo),
# so Qt and the KDE Frameworks are downloaded rather than compiled.
Compile/BuildType = RelWithDebInfo
ContinuousIntegration/Enabled = True
Packager/Destination = ${Variables:WORKSPACE}/packages
Packager/PackageDebugSymbols = False

[BlueprintSettings]
kde/applications/kdeconnect-kde.version = master

# Heavy optional pieces nothing in kdeconnect-kde needs. D-Bus is deliberately NOT ignored:
# kdeconnect-kde requires Qt::DBus and ships dbus-daemon on Windows.
binary/mysql.ignored = True
libs/llvm-meta.ignored = True

[windows-cl-msvc2022-x86_64]
General/ABI = windows-cl-msvc2022-x86_64
