#
# Backup Windows build for the phone-mic fork: KDE Craft via CraftMaster on a
# GitHub-hosted runner, same compiler ABI as KDE's own CI (MSVC 2022 x64).
# Produces the NSIS installer and the .7z as a workflow artifact.

name: Windows (Craft)

on:
  workflow_dispatch:
  push:
    branches:
      - phone-mic
    paths-ignore:
      - '**.md'

jobs:
  build-windows:
    name: Windows x64 (MSVC 2022, Qt 6, KF 6)
    runs-on: windows-2022
    timeout-minutes: 240
    env:
      CRAFT: /C/CraftMaster/windows-cl-msvc2022-x86_64/craft/bin/craft.py

    steps:
    - name: Check out source code
      uses: actions/checkout@v4

    - name: Show free disk space
      shell: pwsh
      run: Get-PSDrive -PSProvider FileSystem | Select-Object Name, @{n='FreeGB';e={[math]::Round($_.Free/1GB,1)}}

    - name: Clone CraftMaster
      run: git clone --depth=1 https://invent.kde.org/packaging/craftmaster.git /C/CraftMaster/CraftMaster

    - name: Configure CraftMaster
      run: python /C/CraftMaster/CraftMaster/CraftMaster.py --config ${{ github.workspace }}/.craftsettings.ini --variables "WORKSPACE=${{ github.workspace }}"

    - name: Install NSIS
      run: python ${{ env.CRAFT }} dev-utils/nsis

    - name: Install dependencies (binary cache)
      run: python ${{ env.CRAFT }} --install-deps kde/applications/kdeconnect-kde

    - name: Build kdeconnect-kde from this checkout
      run: python ${{ env.CRAFT }} --no-cache --options kdeconnect-kde.srcDir=${{ github.workspace }} kde/applications/kdeconnect-kde

    - name: Package (NSIS installer and 7z)
      run: python ${{ env.CRAFT }} --no-cache --options kdeconnect-kde.srcDir=${{ github.workspace }} --package kde/applications/kdeconnect-kde

    - name: Show free disk space after build
      if: always()
      shell: pwsh
      run: Get-PSDrive -PSProvider FileSystem | Select-Object Name, @{n='FreeGB';e={[math]::Round($_.Free/1GB,1)}}

    - name: Upload packages
      uses: actions/upload-artifact@v4
      with:
        name: kdeconnect-kde-windows-x64
        path: packages/*
        if-no-files-found: error
        retention-days: 14
